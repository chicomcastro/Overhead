name: E2E gameplay tests

# Roda os testes e2e (Playwright) que jogam o jogo de verdade, em cada PR/push
# que toque o jogo ou os testes. Publica evidência visual + dados de
# balanceamento como artifacts, joga o relatório no summary e posta um
# sticky comment no PR com screenshots + balanceamento.

on:
  pull_request:
    paths:
      - "web/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [master]
    paths:
      - "web/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Chromium (+ system deps)
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test

      - name: Balance report → job summary
        if: always()
        run: |
          if [ -f reports/balance.md ]; then
            cat reports/balance.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nenhum relatório de balanceamento gerado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence (screenshots + balance + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            e2e/reports
            e2e/playwright-report
          retention-days: 30
          if-no-files-found: ignore

      - name: Post sticky comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const MARKER = '<!-- e2e-evidence-bot -->';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // --- balance report ---
            let balance = '';
            const balancePath = path.join('e2e', 'reports', 'balance.md');
            if (fs.existsSync(balancePath)) {
              balance = fs.readFileSync(balancePath, 'utf8');
            }

            // --- screenshots (inline as <details>) ---
            let screenshots = '';
            const ssDir = path.join('e2e', 'reports', 'screenshots');
            if (fs.existsSync(ssDir)) {
              const files = fs.readdirSync(ssDir).filter(f => f.endsWith('.png')).sort();
              if (files.length) {
                screenshots += '\n\n<details><summary>📸 Screenshots (' + files.length + ')</summary>\n\n';
                for (const f of files) {
                  const label = f.replace('.png', '').replace(/-/g, ' ');
                  screenshots += `**${label}**\n\n`;
                  // screenshots are in the artifact, link to the run
                  screenshots += `> _Ver no artifact [e2e-evidence](${runUrl})_\n\n`;
                }
                screenshots += '</details>\n';
              }
            }

            // --- test result summary ---
            const conclusion = '${{ job.status }}';
            const icon = conclusion === 'success' ? '✅' : '❌';
            const header = `${icon} **E2E — ${conclusion}** · [ver run](${runUrl})`;

            const body = [
              MARKER,
              header,
              '',
              balance || '_Nenhum relatório de balanceamento gerado._',
              screenshots,
              `> Atualizado em ${new Date().toISOString()} · commit ${context.sha.slice(0, 7)}`,
            ].join('\n');

            // find existing bot comment
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
              core.info('Created new sticky comment');
            }
